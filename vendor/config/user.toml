# Sanitized GrokBestFriend user config.
# No tokens, headers, gateway URLs, or model-mapping tables.
# MCP server command paths are written by the installer.

disabled_mcp_servers = [
    "serena",
    "exa",
]

[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[models]
default = "grok-4.6"
default_reasoning_effort = "high"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false
permission_mode = "ask"

[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false

[compat.cursor]
skills = false
rules = false
agents = false
mcps = false
hooks = false

[skills]
ignore = [
    "~/.claude/skills/implement",
    "~/.claude/skills/code-review",
]
paths = []
disabled = []
server_skill_dirs = []
bundled_skill_dirs = []
