name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.18.1"
      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh restore.sh
          bash -n lib/*.sh scripts/*.sh tests/*.sh
      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -S error install.sh uninstall.sh restore.sh lib/*.sh scripts/*.sh tests/*.sh
      - name: Overlay tests
        run: python3 tests/test-overlay.py
      - name: Runtime policy
        run: python3 tests/test-runtime-policy.py
      - name: Doctor dry-run
        run: ./tests/test-doctor-dry-run.sh
      - name: Secret patterns
        run: ./tests/test-no-secrets.sh
      - name: Gitleaks
        run: ./scripts/ci-gitleaks.sh
      - name: MCP policy fixtures
        run: python3 tests/test-mcp-state.py
      - name: MCP config rewrite
        run: python3 tests/test-mcp-config.py
      - name: Node version gate
        run: python3 tests/test-node-version.py
      - name: Node preflight
        run: ./tests/test-node-preflight.sh
      - name: Routing eval
        run: python3 tests/test-routing-eval.py
      - name: Source integrity
        run: ./tests/test-source-integrity.sh
      - name: Snapshot allowlist
        run: ./tests/test-snapshot-allowlist.sh
      - name: Transactional install
        run: ./tests/test-install-transaction.sh
      - name: Design bank dest policy
        run: ./tests/test-design-bank.sh
      - name: Design intelligence
        run: |
          set -euo pipefail
          python3 tests/test-design-intelligence-archive.py
          python3 tests/test-design-intelligence-catalog.py
          python3 tests/test-design-intelligence-classify.py
          python3 tests/test-design-intelligence-search.py
          python3 tests/test-design-intelligence-authority.py
          python3 tests/test-design-intelligence-integration.py
          python3 tests/test-design-intelligence-selection.py
          python3 tests/test-design-intelligence-doctor.py
          python3 tests/test-design-intelligence-optional-audit.py
